name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先确认没有重复 Issue。安全漏洞请不要公开提交，参见 SECURITY.md。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小、可重复的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: OS、Node 版本、运行方式（浏览器或 Electron）及 OpenOS 版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 请移除密钥、Cookie、个人数据，仅保留必要的错误和 request ID。

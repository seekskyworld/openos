name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a linked issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(^|[[:space:]])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'
          if ! printf '%s' "$PR_BODY" | grep -Eiq "$pattern"; then
            echo 'PR body must link a real issue with Closes/Fixes/Resolves/Refs #123.'
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -w @openos/server
      - run: npm audit --omit=dev --audit-level=high
